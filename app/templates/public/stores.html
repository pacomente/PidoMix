{% extends 'base.html' %}
{% from 'public/_macros.html' import store_card %}
{% block title %}Comercios — Trappi{% endblock %}
{% block content %}
<div class="wrap sec"><div class="sec-head"><h2>Comercios</h2></div>
<form class="filters" method="get"><input name="q" value="{{ q or '' }}" placeholder="Buscar comercio"><select name="category_id"><option value="">Todos los rubros</option>{% for c in categories %}<option value="{{ c.id }}" {% if category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><label><input type="checkbox" name="delivery" value="true" {% if delivery %}checked{% endif %}> Con delivery</label><label><input type="checkbox" name="featured" value="true" {% if featured %}checked{% endif %}> Destacados</label><button class="btn small">Filtrar</button></form>
<div class="grid">{% for s in stores %}{{ store_card(s, store_open(s)) }}{% else %}<div class="empty">No encontramos comercios con esos filtros.</div>{% endfor %}</div></div>
{% endblock %}
