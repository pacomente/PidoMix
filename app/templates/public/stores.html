{% extends 'base.html' %}{% block content %}<section class="page"><h1>Comercios</h1><div class="grid">{% for s in stores %}<a class="card" href="/tienda/{{s.slug}}"><div class="cover"></div><div class="pad"><h3>{{s.name}}</h3><p>{{s.description or ''}}</p><small>{{'Delivery disponible' if s.delivery_enabled else 'Solo retiro'}}</small></div></a>{% else %}<p>No encontramos comercios.</p>{% endfor %}</div></section>{% endblock %}
