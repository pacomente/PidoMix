{% extends 'base.html' %}{% block content %}<section class="page"><h1>{{category.name}}</h1><form class="filters" method="get"><input name="q" value="{{q or ''}}" placeholder="Buscar producto"><input type="number" step="0.01" name="min_price" value="{{min_price or ''}}" placeholder="Precio mínimo"><input type="number" step="0.01" name="max_price" value="{{max_price or ''}}" placeholder="Precio máximo"><label><input type="checkbox" name="featured" value="true" {% if featured %}checked{% endif %}> Destacados</label><button class="btn">Filtrar</button></form><div class="product-grid">{% for p in products %}<article class="product"><div class="product-img" style="{% if p.image_url %}background-image:url('{{p.image_url}}'){% endif %}"></div><div class="pad"><small>{{p.store.name}}</small><h3>{{p.name}}</h3><p>{{p.description or ''}}</p><strong>${{p.price}}</strong><button class="btn add" data-product="{{p.id}}">+ Agregar</button></div></article>{% else %}<div class="empty">No encontramos productos en esta categoría.</div>{% endfor %}</div></section>{% endblock %}
