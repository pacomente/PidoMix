{% extends 'base.html' %}{% block content %}<section class="page"><h1>Tiendas</h1><form method="post" class="form card pad"><input name="name" placeholder="Nombre" required><input name="slug" placeholder="Slug" required><input name="whatsapp" placeholder="WhatsApp"><label><input type="checkbox" name="delivery_enabled"> Delivery</label><input name="delivery_cost" type="number" step="0.01" placeholder="Costo de envío"><input name="minimum_order" type="number" step="0.01" placeholder="Pedido mínimo"><button class="btn">Crear tienda</button></form><div class="grid">{% for s in stores %}<div class="card pad"><h3>{{s.name}}</h3><p>{{s.slug}}</p><small>{{s.status.value}}</small></div>{% endfor %}</div></section>{% endblock %}
