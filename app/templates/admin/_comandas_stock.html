{% for section, items in groups.items() %}
<h3>{{ section }}</h3>
<div class="c-stock-grid">
  {% for p in items %}{% set out = p.stock is not none and p.stock <= 0 %}
  <button type="button" class="c-stock {{ 'out' if out }}" data-stock="{{ p.id }}" aria-pressed="{{ 'true' if out else 'false' }}"><b>{{ p.name }}</b><span>{{ 'Agotado' if out else ('Quedan ' ~ p.stock if p.stock is not none else 'Disponible') }}</span></button>
  {% endfor %}
</div>
{% else %}<p class="c-stock-help">No hay productos activos.</p>{% endfor %}
