{% extends 'base.html' %}{% block content %}<section class="page"><div class="section-head"><h1>Usuarios</h1><a href="/admin">Dashboard</a></div><form method="post" class="form card pad"><div class="two"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" minlength="8" required placeholder="Contraseña (8+ caracteres)"></div><div class="two"><select name="role">{% for r in roles %}<option value="{{r.value}}">{{r.value}}</option>{% endfor %}</select><select name="store_id"><option value="">Sin tienda</option>{% for s in stores %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><button class="btn">Crear usuario</button></form><div class="card pad table-wrap"><table><thead><tr><th>Email</th><th>Rol</th><th>Tienda</th><th>Estado</th><th></th></tr></thead><tbody>{% for item in users %}<tr><td>{{item.email}}</td><td>{{item.role.value}}</td><td>{{item.store.name if item.store else '-'}}</td><td>{{'Activo' if item.active else 'Inactivo'}}</td><td>{% if item.id != user.id %}<form method="post" action="/admin/users/{{item.id}}/toggle"><button class="btn small secondary">{{'Desactivar' if item.active else 'Activar'}}</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
