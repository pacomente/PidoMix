<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar — PidoMix</title><link rel="stylesheet" href="/static/css/admin.css"></head>
<body class="admin-auth">
<form class="auth-card" method="post">
  <a class="logo" href="/">Pido<span>Mix</span></a>
  <h1>Ingresar al panel</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input name="email" type="email" placeholder="Email" required autofocus>
  <input name="password" type="password" placeholder="Contraseña" required>
  <button class="btn">Ingresar</button>
</form>
</body></html>
