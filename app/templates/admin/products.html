{% extends 'base.html' %}{% block content %}<section class="page"><div class="section-head"><h1>Productos</h1><a href="/admin">Dashboard</a></div><form method="post" enctype="multipart/form-data" class="form card pad"><h2>Nuevo producto</h2><div class="two"><input name="name" required placeholder="Nombre"><input name="price" required type="number" step="0.01" placeholder="Precio"></div><textarea name="description" placeholder="Descripción"></textarea><div class="two"><select name="store_id" required><option value="">Tienda</option>{% for s in stores %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><select name="category_id"><option value="">Categoría</option>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="two"><input name="previous_price" type="number" step="0.01" placeholder="Precio anterior"><input name="stock" type="number" placeholder="Stock opcional"></div><input name="display_order" type="number" value="0" placeholder="Orden"><input name="file" type="file" accept="image/*"><label><input type="checkbox" name="featured"> Destacado</label><button class="btn">Crear producto</button></form><div class="product-grid">{% for p in products %}<article class="product"><div class="product-img" style="{% if p.image_url %}background-image:url('{{p.image_url}}'){% endif %}"></div><div class="pad"><small>{{p.store.name}} · {{p.category.name if p.category else 'Sin categoría'}}</small><h3>{{p.name}}</h3><strong>${{p.price}}</strong><p>{{p.status.value}}</p><details><summary>Editar producto</summary><form method="post" enctype="multipart/form-data" action="/admin/products/{{p.id}}/edit" class="form"><input name="name" value="{{p.name}}" required><input name="price" type="number" step="0.01" min="0" value="{{p.price}}" required><textarea name="description">{{p.description or ''}}</textarea><div class="two"><select name="store_id">{% for s in stores %}<option value="{{s.id}}" {% if p.store_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select><select name="category_id"><option value="">Sin categoría</option>{% for c in categories %}<option value="{{c.id}}" {% if p.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div><div class="two"><input name="previous_price" type="number" step="0.01" value="{{p.previous_price or ''}}"><input name="stock" type="number" value="{{p.stock if p.stock is not none else ''}}"></div><input name="display_order" type="number" value="{{p.display_order}}"><input name="file" type="file" accept="image/*"><label><input type="checkbox" name="featured" {% if p.featured %}checked{% endif %}> Destacado</label><button class="btn">Guardar</button></form></details><form method="post" action="/admin/products/{{p.id}}/toggle"><button class="btn secondary">{{'Desactivar' if p.status.value=='ACTIVO' else 'Activar'}}</button></form></div></article>{% endfor %}</div></section>{% endblock %}
