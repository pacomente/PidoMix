{% extends 'base.html' %}{% block content %}<section class="page"><div class="section-head"><h1>Categorías de tiendas</h1><a href="/admin">Dashboard</a></div><form method="post" class="form card pad"><div class="two"><input name="name" required placeholder="Nombre"><input name="slug" required placeholder="Slug"></div><button class="btn">Crear categoría</button></form><div class="grid">{% for c in categories %}<div class="card pad"><div class="row"><h3>{{c.name}}</h3><span class="badge">{{'Activa' if c.active else 'Inactiva'}}</span></div><p>{{c.slug}}</p><form method="post" action="/admin/store-categories/{{c.id}}/toggle"><button class="btn secondary">{{'Desactivar' if c.active else 'Activar'}}</button></form></div>{% endfor %}</div></section>{% endblock %}
