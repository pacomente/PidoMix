{% extends 'base.html' %}{% block content %}<section class="page"><div class="section-head"><h1>Categorías</h1><a href="/admin">Dashboard</a></div><form method="post" enctype="multipart/form-data" class="form card pad"><div class="two"><input name="name" required placeholder="Nombre"><input name="slug" required placeholder="Slug"></div><input name="description" placeholder="Descripción"><input name="display_order" type="number" value="0" placeholder="Orden"><input name="file" type="file" accept="image/*"><button class="btn">Crear categoría</button></form><div class="grid">{% for c in categories %}<div class="card pad"><h3>{{c.name}}</h3><p>{{c.slug}}</p><span class="badge">{{'Activa' if c.active else 'Inactiva'}}</span><details><summary>Editar</summary><form method="post" enctype="multipart/form-data" action="/admin/categories/{{c.id}}/edit" class="form"><input name="name" value="{{c.name}}" required><input name="slug" value="{{c.slug}}" required><input name="description" value="{{c.description or ''}}"><input name="display_order" type="number" value="{{c.display_order}}"><input name="file" type="file" accept="image/*"><button class="btn">Guardar</button></form></details><form method="post" action="/admin/categories/{{c.id}}/toggle"><button class="btn secondary">{{'Desactivar' if c.active else 'Activar'}}</button></form></div>{% endfor %}</div></section>{% endblock %}
