{% extends 'base.html' %}{% block content %}<section class="page"><div class="section-head"><h1>Banners</h1><a href="/admin">Dashboard</a></div><form method="post" enctype="multipart/form-data" class="form card pad"><input name="title" placeholder="Título"><input name="subtitle" placeholder="Descripción"><div class="two"><input name="button_text" placeholder="Texto botón"><input name="link" placeholder="URL"></div><input name="display_order" type="number" value="0" placeholder="Orden"><input name="file" type="file" accept="image/*" required><button class="btn">Crear banner</button></form><div class="grid">{% for b in banners %}<div class="card pad"><div class="banner-mini" style="{% if b.image_url %}background-image:url('{{b.image_url}}'){% endif %}"></div><h3>{{b.title}}</h3><span class="badge">{{'Activo' if b.active else 'Inactivo'}}</span><form method="post" action="/admin/banners/{{b.id}}/toggle"><button class="btn secondary">{{'Desactivar' if b.active else 'Activar'}}</button></form></div>{% endfor %}</div></section>{% endblock %}
