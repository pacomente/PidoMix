# Compila el APK de prueba de la app (mobile/) y lo publica en el release "app-android"
# para descargarlo directo desde el celular.
name: APK Android

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias
        run: npm ci

      - name: Chequeos
        run: npx tsc --noEmit && npx expo lint

      # notificaciones push: mobile/google-services.json en el repo, o el secreto GOOGLE_SERVICES_JSON
      - name: Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi
          if [ -f google-services.json ]; then echo "Con notificaciones push"; else echo "::warning::Sin google-services.json: el APK no va a recibir notificaciones push"; fi

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      # el release usa la firma de prueba que genera Expo: sirve para instalar a mano, no para Play Store
      # Sentry: el DSN de la app va en el secreto SENTRY_DSN_APP. Los mapas de código se suben solo si
      # están SENTRY_AUTH_TOKEN, SENTRY_ORG y SENTRY_PROJECT; si no, se omite la subida sin romper la build.
      - name: Compilar APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_APP }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then export SENTRY_DISABLE_AUTO_UPLOAD=true; fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk trappi.apk
          NOTES="APK de prueba generado desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Descargalo desde el celular e instalalo permitiendo apps de fuentes desconocidas."
          if gh release view app-android >/dev/null 2>&1; then
            gh release upload app-android trappi.apk --clobber
            gh release edit app-android --notes "$NOTES"
          else
            gh release create app-android trappi.apk --title "Trappi para Android (prueba)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: trappi-apk
          path: mobile/trappi.apk
