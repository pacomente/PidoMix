# Arma la app de clientes para Google Play: un AAB (.aab) firmado con tu clave de subida ("upload key").
# Se corre a mano (Actions → "App para Google Play" → Run workflow) y deja el .aab para descargar en "Artifacts".
# Si además cargás PLAY_SERVICE_ACCOUNT_JSON, lo sube solo a la prueba interna de Play.
#
# Secretos de GitHub (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64   el archivo .jks en base64 (lo genera "Clave de subida para Google Play")
#   ANDROID_UPLOAD_STORE_PASSWORD    contraseña del archivo
#   ANDROID_UPLOAD_KEY_ALIAS         alias de la clave (por defecto: trappi-upload)
#   ANDROID_UPLOAD_KEY_PASSWORD      contraseña de la clave
#   PLAY_SERVICE_ACCOUNT_JSON        (opcional) cuenta de servicio de Google Play Console para subirlo solo
# Cada envío a Play necesita una versión nueva: subí "version" en mobile/app.json (1.10.0 -> 1.10.1).
name: App para Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Si está PLAY_SERVICE_ACCOUNT_JSON: a qué prueba subirlo (internal, alpha = cerrada, production)'
        default: internal
        required: false

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la clave de subida
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KP" ]; then
            echo "::error::Faltan los secretos de la clave de subida. Corré primero el workflow 'Clave de subida para Google Play' y cargá los 4 secretos."
            exit 1
          fi
          # se ignoran espacios y saltos de línea que se cuelan al copiar y pegar los secretos
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          SP=$(trim "$SP"); KP=$(trim "$KP"); KA=$(trim "$KA"); KA=${KA:-trappi-upload}
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/check.jks" 2>/dev/null || {
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 no es válido: pegá el contenido completo de upload.jks.base64.txt."; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/check.jks" -storetype PKCS12 -storepass "$SP" > /dev/null 2>&1; then
            echo "::error::ANDROID_UPLOAD_STORE_PASSWORD no abre la clave: revisá que sea la del LEEME.txt."; rm -f "$RUNNER_TEMP/check.jks"; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/check.jks" -storetype PKCS12 -storepass "$SP" -alias "$KA" > /dev/null 2>&1; then
            echo "::error::ANDROID_UPLOAD_KEY_ALIAS no coincide: tiene que ser trappi-upload."; rm -f "$RUNNER_TEMP/check.jks"; exit 1
          fi
          rm -f "$RUNNER_TEMP/check.jks"
          echo "Clave de subida OK."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias
        run: npm ci

      - name: Chequeos
        run: npx tsc --noEmit && npx expo lint

      - name: Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi
          if [ ! -f google-services.json ]; then echo "::warning::Sin google-services.json: la app no va a recibir notificaciones push"; fi

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Firmar con la clave de subida
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<'GRADLE'

          // firma para Google Play (la agrega el workflow; las claves vienen de los secretos de GitHub)
          android {
              signingConfigs {
                  upload {
                      storeFile file('upload.jks')
                      storePassword System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')?.trim()
                      keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')?.trim() ?: 'trappi-upload'
                      keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')?.trim()
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE

      - name: Compilar AAB
        working-directory: mobile/android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_APP }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then export SENTRY_DISABLE_AUTO_UPLOAD=true; fi
          ./gradlew bundleRelease --no-daemon
          rm -f app/upload.jks

      - name: Versión
        id: v
        run: echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: trappi-${{ steps.v.outputs.name }}-google-play
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Subir a Google Play (si está la cuenta de servicio)
        if: env.PLAY_JSON != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ar.trappi.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft
