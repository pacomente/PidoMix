services:
  - type: web
    name: pidomix
    runtime: python
    # Plan free: Render no ofrece Pre-Deploy Command (es una función de planes
    # pagos), asi que las migraciones y el seed corren dentro del Build Command.
    # Si en el futuro se pasa a un plan pago, esto se puede volver a separar en
    # preDeployCommand para no re-ejecutarlo en cada build.
    buildCommand: python --version && pip install -r requirements.txt && python -m alembic upgrade head && python -m app.verify_database && python -m app.seed
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: pidomix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHATSAPP_DEFAULT_NUMBER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://pidomix-1.onrender.com
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: MERCADOPAGO_ENVIRONMENT
        value: sandbox
      - key: MERCADOPAGO_CLIENT_ID
        sync: false
      - key: MERCADOPAGO_CLIENT_SECRET
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_REDIRECT_URI
        value: https://pidomix-1.onrender.com/admin/pagos/mercadopago/callback
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: ROUTING_PROVIDER
        value: osrm
      - key: ROUTING_URL
        sync: false

databases:
  - name: pidomix-db
    databaseName: pidomix
    user: pidomix
